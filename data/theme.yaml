# ============================================================================
# 幻梦 Illusion v1.1.0 —— 站点数据文件（data/theme.yaml）
# ============================================================================
# 本文件是主题的“唯一数据源”：首页、关于、技能、友链、404、布局开关
# 全部从这里读取。模板里通过 hugo.Data.theme.xxx 访问。
#
# 迁移说明（PaperMod → 幻梦）：
#   1. 旧 hugo.yaml 里的 profileMode / socialIcons / 菜单已分别对应到
#      本文件的 home.hero、social.links 与站点 hugo.yaml 的 menus。
#   2. 头像、背景图改为引用 static/ 下的真实文件。
#   3. 友链从旧 content/links.md 的 Markdown 表格搬到了 friends.friends。
#   4. 文末 layout 段集中控制毛玻璃、粒子、3D 倾斜、滚动淡入等特效。
# ============================================================================


# ============================================================================
# 首页（Home）
# ============================================================================
home:

  # ----- Hero 首屏 -----
  hero:
    title: "uestc-fleetsnowfluff"          # 首屏主标题
    greeting: "你好，我是"                  # 主标题前的问候语
    badgeText: "欢迎来到我的世界"           # 首屏顶部小徽章

    subtitles:                             # 打字机轮播的副标题
      - "ML 开发者"
      - "生活记录者"
      - "在代码里造梦的人"
      - "大一学习中"

    description: "这里记录机器学习的学习笔记与思考，也顺手记下生活里的碎片。"

    primaryBtn:
      text: "阅读文章"
      url: "/posts/"

    secondaryBtn:
      text: "翻翻归档"
      url: "/archives/"

    quote:
      text: "代码是诗，键盘是笔，屏幕是画布。"
      author: "uestc-fleetsnowfluff"

  # ----- 最新文章板块 -----
  posts:
    title: "最新文章"
    subtitle: "分享思考，记录成长"
    count: 6                               # 首页展示的文章数量
    showMore:
      text: "查看所有文章"
      url: "/posts/"

  # ----- 关于我板块 -----
  about:
    title: "关于 uestc-fleetsnowfluff"
    description: "机器学习方向的学生，喜欢把学到的东西写下来，也喜欢折腾博客主题和 Live2D 看板娘。"
    btnText: "看看归档"
    btnUrl: "/archives/"

  # ----- 技术栈板块 -----
  skills:
    title: "技术栈"
    subtitle: "不断学习，持续进步"
    count: 6


