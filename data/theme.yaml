# ============================================================================
# 技能（Skills）
# 首页“技术栈”板块与页脚标签都取 skills.skills 的前若干项。
# ============================================================================
skills:

  overview:
    categories:
      - icon: "fas fa-brain"
        title: "机器学习"
        description: "PyTorch、Transformer、训练与调参"
        progress: 70
      - icon: "fas fa-square-root-alt"
        title: "数学基础"
        description: "线性代数、概率统计、微积分"
        progress: 65
      - icon: "fab fa-python"
        title: "Python 工程"
        description: "NumPy、Pandas、脚本与数据处理"
        progress: 80
      - icon: "fas fa-tools"
        title: "开发工具"
        description: "Git、VS Code、Hugo、LaTeX"
        progress: 70

  skills:
    - name: "Python"
      level: 80
      description: "日常主力语言，用来写训练脚本、数据清洗和小工具。"
      projects:
        - "nanoGPT 复现笔记"
        - "位置编码实验"
    - name: "PyTorch"
      level: 70
      description: "能独立搭小模型、写训练循环、读官方教程和源码。"
      projects:
        - "nanoGPT 复现"
    - name: "NumPy"
      level: 75
      description: "矩阵运算、广播机制、向量化改造。"
      projects: []
    - name: "LaTeX"
      level: 65
      description: "用于数学公式排版和课程报告。"
      projects: []
    - name: "Git"
      level: 70
      description: "版本管理、分支、GitHub Actions 部署博客。"
      projects:
        - "本博客的自动部署流水线"
    - name: "Hugo"
      level: 60
      description: "主题定制、模板改造、资源管道调优。"
      projects:
        - "PaperMod → 幻梦主题迁移"
    - name: "HTML / CSS"
      level: 55
      description: "能读懂模板、改样式，前端不算专业但够用。"
      projects: []
    - name: "JavaScript"
      level: 50
      description: "看得懂主题脚本，能改小交互（比如 Live2D 看板娘）。"
      projects:
        - "Live2D 看板娘接入"

  timeline:
    - year: "2025"
      title: "起步"
      description: "接触 Python 和机器学习，开始写第一份学习笔记。"
    - year: "2026"
      title: "深入"
      description: "系统学习 Transformer 与位置编码，搭起自己的博客。"


