# ============================================================================
# 404 页面
# ============================================================================
error404:

  page:
    title: "404"
    description: "页面不存在或已被移除"
    message: "抱歉，你访问的页面不存在。可能已被删除，或者链接写错了。"
    icon: "fas fa-ghost"

  buttons:
    home:
      text: "返回首页"
      icon: "fas fa-home"
      url: "/"
    posts:
      text: "浏览文章"
      icon: "fas fa-file-alt"
      url: "/posts/"


# ============================================================================
# 标签页
# ============================================================================
tags:
  page:
    title: "标签"
    subtitle: "浏览所有文章标签"
    perPage: 25


# ============================================================================
# 布局与视觉策略（layout）
# ============================================================================
layout:

  posts:
    layout: "grid"                         # grid 网格 / list 列表
    columns: 2
    perPage: 12
    excerptLength: 160
    showDate: true
    showCategory: true
    showTags: true
    showExcerpt: true

  skills:
    layout: "grid"
    showCategories: true
    showDetailed: true
    showTimeline: true
    showProjects: true

  links:
    showCategory: true

  sidebar:
    position: "right"
    showTOC: true
    showInfo: true
    showTags: true

  codeblock:
    showLang: true
    showCopy: true
    expandLines: 0
    lineNumbers: false

  # ----- 全局视觉特效（毛玻璃 / 粒子 / 3D 倾斜 / 滚动淡入） -----
  effects:
    enabled: true
    glass: true
    aurora: true
    mouseGlow: true
    card3d: true
    cardShine: true
    scrollReveal: true
    particles: true
    nightSky: true
    noise: true

  hero:
    enhanced: true
    aurora: true
    glass: true
    mouseGlow: true
    particles: true
    floating: true

  cards:
    glass: true
    lift: true
    glow: true
    mouseGlow: true
    tilt: true
    imageZoom: true

  article:
    readingProgress: true
    enhancedHeader: true
    coverEffect: true
    readableLayout: true
    relatedPosts: true

  performance:
    auto: true
    level: "normal"
    respectReducedMotion: true
    pauseWhenHidden: true
    reduceOnMobile: true
    reduceOnLowPower: true
    adaptiveDpr: true
    adaptiveParticles: true
    adaptiveFps: true

  accessibility:
    reducedMotion: true
    keyboardNavigation: true
    visibleFocus: true
    decorativeEffectsPointerEventsNone: true
