# ============================================================================
# 图片资源（Assets）
# ============================================================================
assets:

  # ----- 站点头像 -----
  avatar:
    url: "/images/avatar.png"
    alt: "站点头像"

  # ----- 背景图 -----
  # 每次加载页面，从 random.images 里随机取一张（模板见 themes/illusion/layouts/_default/baseof.html）。
  # 背景图之上会叠一层跟随主题的遮罩（--overlay），所以深浅色共用同一组图即可。
  background:

    # 随机背景（推荐）
    random:
      enabled: true
      images:
        - "/images/bg1.jpg"
        - "/images/bg2.jpg"
        - "/images/bg3.jpg"
        - "/images/bg4.jpg"
        - "/images/bg5.png"
        - "/images/bg6.jpg"
        - "/images/bg7.jpg"
        - "/images/bg8.png"
        - "/images/bg9.png"

    # 以下三项是「随机未启用」时的兜底单图；mobile / desktop 目前只是占位，模板未使用。
    mobile:
      url: "/images/bg1.jpg"
      alt: "移动端背景"

    desktop:
      url: "/images/bg1.jpg"
      alt: "桌面端背景"

    adaptive:
      url: "/images/bg1.jpg"
      alt: "自适应背景"
      description: "随机背景关闭时使用的兜底图"

  # ----- OpenGraph 分享图 -----
  openGraph:
    default:
      url: "/images/avatar.png"
      alt: "分享配图"
      width: 1200
      height: 630

  # ----- 默认占位 -----
  defaults:
    postCover: ""                          # 留空：无封面时卡片走纯毛玻璃占位，不插空 img
    friendAvatar: "/images/friends/default.png"
    skillIcon: "fas fa-code"


