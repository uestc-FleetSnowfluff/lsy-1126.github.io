baseURL: "https://uestc-fleetsnowfluff.github.io/"
title: "uestc-fleetsnowfluff's Blog"
theme: "PaperMod"
languageCode: "zh-CN"

# 开启首页的个人简介和社交图标
params:
  author: "uestc-fleetsnowfluff"
  description: "This is uestc-fleetsnowfluff's personal Blog"
  ShowReadingTime: true      # 显示阅读时间
  ShowShareButtons: true     # 显示分享按钮
  ShowPostNavLinks: true     # 显示上一篇/下一篇
  ShowBreadCrumbs: true      # 显示面包屑导航
  ShowCodeCopyButtons: true  # 代码块显示复制按钮
  homeInfoParams:
    Title: "你好，我是uestc-fleetsnowfluff"
    Content: "欢迎来到我的博客，这里记录我的学习和生活。"
  profileMode:
    enabled: true            # 开启首页个人资料模式
    title: "uestc-fleetsnowfluff"
    subtitle: "ML开发+生活"
    imageUrl: "/images/avatar.jpg" # 这里的路径对应 static 文件夹里的图片
    imageWidth: 120          # 头像宽度
    imageHeight: 120         # 头像高度

# 顶部导航菜单
menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 40