# ----- 页脚「关于我」段落：把「前端开发」改成 ML 开发 -----
footer_about_desc:
  other: "{{ .Author }}，一名热爱技术的开发者。专注于 ML 开发、移动应用和新兴技术。"

# ----- 首页「关于」卡片的头像 alt（主题默认写死成「爱则心痛」） -----
siteauthor:
  other: "uestc-fleetsnowfluff"

# ----- 首页「关于」描述的后备文案（data/theme.yaml 有值时不会用到，留作兜底） -----
home_about_desc:
  other: "机器学习方向的学生，喜欢把学到的东西写下来。"
